<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunch Spinner 🍴</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background: #fafafa;
      color: #333;
      padding: 40px;
    }

    h1 { margin-bottom: 10px; }

    canvas {
      margin-top: 20px;
      border: 2px solid #ddd;
      border-radius: 50%;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #0078d7;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #005fa3; }
button:hover { transform: scale(1.05); }

    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    input {
      padding: 6px 10px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #filterContainer button.active {
      background: #00a86b;
    }

    #restaurantList {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

#filterContainer button {
  margin: 4px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: #ddd;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}

#filterContainer button.active {
  background: #00a86b;
  color: white;
}

body.veto #filterContainer button.active {
  background: #d9534f;
  color: white;
}

.card {
  background: rgba(255,255,255,0.8);
  padding: 30px;
  border-radius: 20px;
  display: inline-block;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

body {
  background: linear-gradient(135deg, #f7f9fc, #eaf3ff);
}

/* === Glow and polish tweaks === */
button {
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Make tag buttons look like chips */
#restaurantList button {
  background: #f1f3f6;
  color: #333;
  border: none;
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 0.9em;
}

#restaurantList button:hover {
  background: #dfe9ff;
}

/* Add a subtle hover effect on restaurant list items */
#restaurantList li {
  background: rgba(255,255,255,0.8);
  border-radius: 12px;
  padding: 12px;
  margin: 8px 0;
  transition: background 0.2s, box-shadow 0.2s;
}

#restaurantList li:hover {
  background: white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

#restaurantList li.disabled {
  opacity: 0.55;
  filter: grayscale(0.2);
}

#restaurantList li.disabled:hover {
  background: rgba(255,255,255,0.9);
}

/* Small accent border on active mode */
body.veto .card {
  border: 2px solid #d9534f;
}

body:not(.veto) .card {
  border: 2px solid #00a86b;
}

#wheelPointer {
  font-size: 2rem;
  text-align: center;
  color: #333;
  margin-bottom: -20px;
  user-select: none;
  transform: translateY(10px);
}

.pulse-element {
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% {
    transform: scale(1) translateY(25%);
  }
  50% {
    transform: scale(1.2) translateY(10%);
  }
  100% {
    transform: scale(1) translateY(25%);
  }
}



  </style>
  <script src="https://cdn.jsdelivr.net/gh/zarocknz/javascript-winwheel/Winwheel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
</head>
<body>
<div class="card">
  <h1>Lunch Spinner 🍴</h1>
  <div id="wheelPointer">▼</div>
  <canvas id="wheel" width="400" height="400"></canvas><br>
  <button id="spinBtn">Spin!</button>

  <div class="controls">
    <h2>Add a Restaurant</h2>
    <input id="nameInput" placeholder="Restaurant name">
    <input id="tagsInput" placeholder="Tags (comma-separated)">
    <button id="addBtn">Add</button>

    <h2>Filter by Category</h2>
<button id="toggleAllBtn">Select All</button>
<button id="vetoModeBtn">Veto Mode: OFF</button>
<div id="filterContainer"></div>

  <ul id="restaurantList"></ul>
</div>

  <script>
let vetoMode = false;
    let restaurants = JSON.parse(localStorage.getItem('restaurants')) || [
      { name: "Chipotle", tags: ["Mexican", "Fast Casual"], enabled: true },
      { name: "Subway", tags: ["Sandwich", "Fast Food"], enabled: true },
      { name: "Panda Express", tags: ["Asian", "Fast Food"], enabled: true },
    ];

    let activeFilters = [];
    let wheel;

    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 70%, 60%)`;
    }

    function drawWheel(items) {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      if (items.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        wheel = null;
        return;
      }

      const segments = items.map(r => ({ fillStyle: randomColor(), text: r.name }));
      wheel = new Winwheel({
        canvasId: 'wheel',
        numSegments: segments.length,
        outerRadius: 180,
        segments: segments,
        animation: {
          type: 'spinToStop',
          duration: 4,
          spins: 8,
          callbackFinished: announceWinner
        }
      });
    }

    function announceWinner(segment) {
      alert(`🎉 Winner: ${segment.text}!`);
    }

    function toggleRestaurantEnabled(index) {
      restaurants[index].enabled = !restaurants[index].enabled;
      refreshList();
    }
	
	function removeTag(restaurantIndex, tagIndex) {
	  restaurants[restaurantIndex].tags.splice(tagIndex, 1);
	  refreshList();
	}

	function addTag(restaurantIndex, inputElement) {
	  const newTag = inputElement.value.trim();
	  if (!newTag) return;
	  const restaurant = restaurants[restaurantIndex];
	  if (!restaurant.tags.includes(newTag)) {
		restaurant.tags.push(newTag);
		inputElement.value = '';
		refreshList();
	  } else {
		alert('That tag already exists.');
	  }
	}

	function refreshList() {
	  const list = document.getElementById('restaurantList');
	  list.innerHTML = '';

	  restaurants.forEach((r, i) => {
		const li = document.createElement('li');
		li.classList.toggle('disabled', !r.enabled);
		li.title = r.enabled ? 'Click to disable this restaurant' : 'Click to re-enable this restaurant';
		li.addEventListener('click', () => toggleRestaurantEnabled(i));

		// Restaurant name
		const nameSpan = document.createElement('strong');
		nameSpan.textContent = r.name + ' ';
		li.appendChild(nameSpan);
		
		// Edit name button
		const editBtn = document.createElement('button');
		editBtn.textContent = '✏️';
		editBtn.title = 'Edit restaurant name';
		editBtn.style.marginLeft = '6px';
		editBtn.addEventListener('click', event => {
		  event.stopPropagation();
		  const newName = prompt('Rename restaurant:', r.name);
		  if (newName && newName.trim()) {
			restaurants[i].name = newName.trim();
			refreshList();
		  }
		});
		li.appendChild(editBtn);

		// Remove restaurant button
		const removeBtn = document.createElement('button');
		removeBtn.textContent = '✕';
		removeBtn.title = 'Remove restaurant';
		removeBtn.addEventListener('click', event => {
		  event.stopPropagation();
		  removeRestaurant(i);
		});
		li.appendChild(removeBtn);

		// Tag section
		const tagContainer = document.createElement('div');
		tagContainer.style.marginTop = '6px';

		r.tags.forEach((tag, tagIndex) => {
		  const tagBtn = document.createElement('button');
		  tagBtn.textContent = tag + ' ✕';
		  tagBtn.style.margin = '3px';
		  tagBtn.style.padding = '4px 8px';
		  tagBtn.style.border = 'none';
		  tagBtn.style.borderRadius = '6px';
		  tagBtn.style.background = '#ddd';
		  tagBtn.style.cursor = 'pointer';
		  tagBtn.addEventListener('click', event => {
		    event.stopPropagation();
		    removeTag(i, tagIndex);
		  });
		  tagContainer.appendChild(tagBtn);
		});

		// Add tag input and button
		const addTagInput = document.createElement('input');
		addTagInput.placeholder = 'New tag';
		addTagInput.style.marginLeft = '6px';
		addTagInput.style.padding = '4px 6px';
		addTagInput.style.borderRadius = '6px';
		addTagInput.style.border = '1px solid #ccc';
		addTagInput.style.width = '100px';

		const addTagBtn = document.createElement('button');
		addTagBtn.textContent = '+';
		addTagBtn.title = 'Add tag';
		addTagBtn.style.marginLeft = '4px';
		addTagBtn.style.padding = '4px 8px';
		addTagBtn.addEventListener('click', event => {
		  event.stopPropagation();
		  addTag(i, addTagInput);
		});

		// Allow pressing Enter to add tag
		addTagInput.addEventListener('keypress', e => {
		  e.stopPropagation();
		  if (e.key === 'Enter') addTag(i, addTagInput);
		});

		addTagInput.addEventListener('click', e => e.stopPropagation());

		tagContainer.appendChild(addTagInput);
		tagContainer.appendChild(addTagBtn);
		li.appendChild(tagContainer);

		list.appendChild(li);
	  });

	  updateFilters();
	  saveData();
	  drawWheel(filteredRestaurants());
	}

    function removeRestaurant(index) {
      restaurants.splice(index, 1);
      refreshList();
    }

    function saveData() {
      localStorage.setItem('restaurants', JSON.stringify(restaurants));
    }

    function addRestaurant() {
      const name = document.getElementById('nameInput').value.trim();
      const tags = document.getElementById('tagsInput').value.split(',')
        .map(t => t.trim()).filter(Boolean);
      if (!name) return alert("Enter a name first!");
      restaurants.push({ name, tags });
      document.getElementById('nameInput').value = '';
      document.getElementById('tagsInput').value = '';
      refreshList();
    }

function updateFilters() {
  const allTags = [...new Set(restaurants.flatMap(r => r.tags))];
  const container = document.getElementById('filterContainer');
  container.innerHTML = '';

  // Update Select/Deselect All button text
  const toggleBtn = document.getElementById('toggleAllBtn');
  toggleBtn.textContent = activeFilters.length === allTags.length
    ? 'Deselect All'
    : 'Select All';

  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.textContent = tag;
    if (activeFilters.includes(tag)) btn.classList.add('active');
    btn.onclick = () => toggleFilter(tag);
    container.appendChild(btn);
  });
}

function toggleFilter(tag) {
  if (activeFilters.includes(tag))
    activeFilters = activeFilters.filter(t => t !== tag);
  else
    activeFilters.push(tag);

  refreshList();
}

function toggleAllFilters() {
  const allTags = [...new Set(restaurants.flatMap(r => r.tags))];
  if (activeFilters.length === allTags.length) {
    // All selected → clear filters
    activeFilters = [];
  } else {
    // Not all selected → select all
    activeFilters = [...allTags];
  }
  refreshList();
}

document.getElementById('toggleAllBtn').addEventListener('click', toggleAllFilters);
document.getElementById('vetoModeBtn').addEventListener('click', () => {
  vetoMode = !vetoMode;
  document.body.classList.toggle('veto', vetoMode);
  document.getElementById('vetoModeBtn').textContent = `Veto Mode: ${vetoMode ? 'ON' : 'OFF'}`;
  refreshList();
});



function filteredRestaurants() {
  const visibleRestaurants = restaurants.filter(r => r.enabled);
  if (activeFilters.length === 0) return visibleRestaurants;

  if (vetoMode) {
    // Exclude restaurants that match ANY active tag
    return visibleRestaurants.filter(r => !r.tags.some(t => activeFilters.includes(t)));
  } else {
    // Include restaurants that match ANY active tag
    return visibleRestaurants.filter(r => r.tags.some(t => activeFilters.includes(t)));
  }
}

// Add a slow idle wobble animation for fun
function idleWobble() {
  gsap.to('#wheel', {
    rotation: "+=3",
    duration: 3,
    yoyo: true,
    repeat: -1,
    ease: "sine.inOut"
  });
}
idleWobble();

function announceWinner(segment) {
  document.querySelector('h1').textContent = `🎉 ${segment.text}!`;
  const pointer = document.getElementById('wheelPointer');
  if (pointer) {
    pointer.classList.add('pulse-element');
  }
}



    document.getElementById('addBtn').addEventListener('click', addRestaurant);
    document.getElementById('spinBtn').addEventListener('click', () => {
      if (wheel) wheel.startAnimation();
    });

    refreshList();
  </script>
</body>
</html>
